/* Griglia intera: il pannello si apre solo selezionando una casella. */
body.playing{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
body.playing>header{height:64px;min-height:64px;padding:0 3%}
main.game-screen{width:100%;max-width:none;margin:0;flex:1;min-height:0;padding:14px 3% 18px;display:flex;flex-direction:column}
.game-screen .game-head{flex-shrink:0;margin:0 0 10px;gap:12px;align-items:center}
.game-screen .game-head h1{font-size:26px;margin:5px 0 0}
.game-screen .eyebrow{font-size:11px;letter-spacing:1.4px}
.game-status{display:flex;justify-content:space-between;gap:14px;align-items:center;font-size:14px;color:var(--muted);flex-shrink:0}
.game-status .progress-label{white-space:nowrap}
.game-screen>.progress{flex-shrink:0;margin:9px 0 12px}
.play-workspace{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.play-workspace.editing{grid-template-columns:minmax(0,1fr) minmax(300px,350px)}
#board-stage{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#e5edef;border-radius:10px}
.game-screen .board{flex:none;max-width:none;margin:0}
.game-screen .cell,.game-screen .blank{aspect-ratio:auto;min-width:0;min-height:0}
.game-screen .cell{font-size:var(--cell-font);line-height:1}
.game-screen .cell small{font-size:var(--number-font);top:1px;left:1px}
.game-screen .cell:focus-visible{outline-offset:-2px;z-index:1}
.word-panel{min-height:0;overflow:auto;align-self:center;max-height:100%;padding:20px;background:white;border:1px solid var(--line);border-radius:12px}
.word-panel[hidden]{display:none}
.word-panel-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.word-panel-top button{font-size:14px;padding:8px 12px}
.word-panel h2{font-size:18px;line-height:1.45;letter-spacing:0;margin:14px 0}
.word-panel label{display:block;font-size:14px;margin-bottom:8px}
.word-panel .feedback{margin-top:10px;font-size:14px;min-height:20px}
.word-panel .entry-nav{margin-top:10px;gap:8px}
.word-panel .entry-nav button{padding:10px;font-size:14px}
.direction-options{display:flex;gap:8px;margin-top:8px}
.direction-options:empty{display:none}
.direction-options button{font-size:14px;padding:8px;flex:1}
.direction-options [aria-pressed=true]{background:#d0edef;border-color:var(--teal)}
@media(orientation:portrait),(max-width:700px){
 .play-workspace.editing{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;gap:12px}
 .word-panel{width:100%;max-height:45dvh;align-self:stretch;padding:12px 16px}
 .word-panel h2{margin:8px 0;font-size:16px}
 .word-panel .entry-nav{margin-top:6px}
 .word-panel .feedback{margin:6px 0 0;min-height:0}
 .word-panel .feedback:empty{display:none}
 .game-status{font-size:12px}
 .game-status .progress-label{font-size:12px}
}
@media(max-height:560px){
 body.playing>header{height:48px;min-height:48px}
 main.game-screen{padding:8px 2%}
 .game-screen .game-head h1{font-size:20px}
 .game-screen .game-head{margin-bottom:4px}
 .game-screen .eyebrow{display:none}
 .game-screen>.progress{margin:5px 0 7px}
 .word-panel{padding:12px}
}

/* Conferma della parola: effetto progressivo senza spostare la griglia. */
.game-screen .cell.correct{background:#dbf2e6;color:#165b3b}
.game-screen .cell.correct.active{background:#bce6d0}
.game-screen .cell.correct.cursor{box-shadow:inset 0 0 0 2px #0c6a70}
.game-screen .cell.celebrating{animation:correct-glow 620ms ease-in-out var(--success-delay) both}
.game-screen .cell.celebrating>span{display:inline-block;animation:correct-letter 620ms cubic-bezier(.22,.61,.36,1) var(--success-delay) both;transform-origin:center}
@keyframes correct-letter{0%{transform:scale(.7);opacity:.4}48%{transform:scale(1.3);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes correct-glow{0%{background:#dbf2e6}48%{background:#7bd3a4;box-shadow:inset 0 0 0 2px #218456}100%{background:#dbf2e6}}
@media(prefers-reduced-motion:reduce){
 .game-screen .cell.celebrating,.game-screen .cell.celebrating>span{animation:none;transform:none}
 .game-screen .cell.celebrating{background:#bce6d0;box-shadow:inset 0 0 0 2px #218456}
}

/* Versione 6: impaginazione v3, lettere proporzionate alle caselle. */
.game-screen .cell>span{font-size:inherit;line-height:1;min-width:0}

 return cellsOf(word).map(k=>others.has(k)?state.letters[k]||'':'');
}
function isCorrect(w){return cellsOf(w).map(k=>state.letters[k]||'').join('')===w.text}
let boardObserver;
let completionTimer;
const successTimers=new Set();
function clearSuccessEffects(){
 clearTimeout(completionTimer);
 successTimers.forEach(clearTimeout);successTimers.clear();
 app.querySelectorAll('.celebrating').forEach(cell=>cell.classList.remove('celebrating'));
}
// Piccola onda di conferma: le lettere crescono e tornano alla dimensione normale.
function celebrateWords(words){
 const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 const seen=new Set();let duration=0;
 for(const word of words){
  cellsOf(word).forEach((k,i)=>{
   if(seen.has(k))return;seen.add(k);
   const cell=app.querySelector(`.cell[data-key="${k}"]`);if(!cell)return;
   const delay=reduced?0:i*38;
   cell.style.setProperty('--success-delay',delay+'ms');
   cell.classList.remove('celebrating');void cell.offsetWidth;
   cell.classList.add('celebrating');duration=Math.max(duration,delay+(reduced?220:620));
  });
 }
 if(words.length){
  const timer=setTimeout(()=>{seen.forEach(k=>app.querySelector(`.cell[data-key="${k}"]`)?.classList.remove('celebrating'));successTimers.delete(timer)},duration+30);
  successTimers.add(timer);
 }
 clearTimeout(completionTimer);
 if(state.puzzle.words.every(isCorrect)){
  const puzzle=state.puzzle;
  completionTimer=setTimeout(()=>{if(state.puzzle===puzzle&&document.getElementById('board')&&puzzle.words.every(isCorrect))complete()},Math.max(300,duration+220));
 }
}

function leaveGame(){clearSuccessEffects();boardObserver?.disconnect();document.body.classList.remove('playing');app.classList.remove('game-screen');}
function fitBoard(){
 const stage=document.getElementById('board-stage'),board=document.getElementById('board');
 if(!stage||!board||!state.puzzle)return;
 const {width,height}=state.puzzle;
 const cell=Math.max(1,Math.min((stage.clientWidth-width-1)/width,(stage.clientHeight-height-1)/height));
 board.style.width=(cell*width+width+1)+'px';
 board.style.height=(cell*height+height+1)+'px';
 board.style.setProperty('--cell-font',Math.min(24,cell*.57)+'px');
 board.style.setProperty('--number-font',Math.min(11,cell*.25)+'px');
}
function renderGame(){
 leaveGame();document.body.classList.add('playing');app.classList.add('game-screen');
 const {module:m,puzzle:p}=state;
 app.innerHTML=`<div class="game-head"><div><span class="eyebrow">MODULO ${String(MODULI.indexOf(m)+1).padStart(2,'0')} / ${esc(m.subject).toUpperCase()}</span><h1>${esc(m.title)}</h1></div><button class="quiet" id="back">← Tutti i moduli</button></div>
 <div class="game-status"><span id="touch-help">Tocca una casella per leggere la definizione e scrivere la parola.</span><span class="progress-label" id="progress-label"></span></div>
 <div class="progress"><span id="progress-bar"></span></div>
 <div class="play-workspace" id="play-workspace"><section id="board-stage" aria-label="Griglia del cruciverba"><div id="board" class="board"></div></section>
 <section class="word-panel" id="word-panel" aria-labelledby="clue-title" hidden>
 <div class="word-panel-top"><span class="entry-meta" id="entry-meta"></span><button class="quiet" id="close-word" aria-label="Chiudi la definizione">Chiudi ×</button></div>
 <div class="direction-options" id="directions" aria-label="Scegli la direzione"></div>
 <h2 id="clue-title"></h2><label for="answer">La tua risposta <span id="length"></span></label>
 <div class="entry-row"><input id="answer" type="text" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" aria-describedby="entry-meta clue-title" placeholder="Scrivi la parola intera"></div>
 <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
 </section></div>`;
 const board=document.getElementById('board');board.style.gridTemplateColumns=`repeat(${p.width},minmax(0,1fr))`;board.style.gridTemplateRows=`repeat(${p.height},minmax(0,1fr))`;
 const occupied={},starts={};p.words.forEach(w=>{cellsOf(w).forEach((k,i)=>occupied[k]=w.text[i]);starts[key(w.r,w.c)]=w.number});
 for(let r=0;r<p.height;r++)for(let c=0;c<p.width;c++){
  const k=key(r,c),b=document.createElement(occupied[k]?'button':'span');
  if(occupied[k]){b.className='cell';b.dataset.key=k;b.innerHTML=`${starts[k]?`<small>${starts[k]}</small>`:''}<span></span>`;b.onclick=()=>{
   const choices=p.words.map((w,i)=>({w,i})).filter(x=>cellsOf(x.w).includes(k));
   const same=state.anchor===k?choices.findIndex(x=>x.i===state.selected):-1;
   state.anchor=k;select(choices[(same+1)%choices.length].i);
  };}else b.className='blank';board.appendChild(b);
 }
 document.getElementById('back').onclick=levels;
 document.getElementById('close-word').onclick=closeWord;
 document.getElementById('answer').oninput=e=>{
  const previouslyCorrect=new Set(p.words.filter(isCorrect).map(w=>w.id));clearSuccessEffects();
  const w=p.words[state.selected],value=Crossword.normalize(e.target.value).slice(0,w.text.length);e.target.value=value;
  applyWordInput(w,value,state.entryBaseline);
  document.getElementById('feedback').textContent='';updateBoard();
  if(cellsOf(w).every(k=>Boolean(state.letters[k])))check();
  celebrateWords(p.words.filter(word=>isCorrect(word)&&!previouslyCorrect.has(word.id)));
 };
 boardObserver=new ResizeObserver(fitBoard);boardObserver.observe(document.getElementById('board-stage'));
 updateBoard();fitBoard();
}
function closeWord(){
 const panel=document.getElementById('word-panel');panel.hidden=true;
 document.getElementById('play-workspace').classList.remove('editing');
 const target=app.querySelector(`.cell[data-key="${state.anchor||cellsOf(state.puzzle.words[state.selected])[0]}"]`);
 target?.focus({preventScroll:true});updateBoard();
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('word-panel')&&!document.getElementById('word-panel').hidden)closeWord()});
function select(i){document.getElementById('word-panel').hidden=false;document.getElementById('play-workspace').classList.add('editing');state.selected=i;const w=state.puzzle.words[i];document.getElementById('entry-meta').textContent=`${w.number} ${w.d?'VERTICALE':'ORIZZONTALE'}`;document.getElementById('clue-title').textContent=w.clue;document.getElementById('length').textContent=`(${w.text.length} lettere)`;const input=document.getElementById('answer');input.maxLength=w.text.length+10;const letters=cellsOf(w).map(k=>state.letters[k]||'');state.entryBaseline=captureCrossings(w);input.value=letters.every(Boolean)?letters.join(''):'';input.placeholder='Scrivi la parola intera';document.getElementById('feedback').textContent='';const choices=state.anchor?state.puzzle.words.map((w,i)=>({w,i})).filter(x=>cellsOf(x.w).includes(state.anchor)):[];document.getElementById('directions').innerHTML=choices.length>1?choices.map(x=>`<button class="quiet" data-direction="${x.i}" aria-pressed="${x.i===i}">${x.w.number} ${x.w.d?'↓ Verticale':'→ Orizzontale'}</button>`).join(''):'';app.querySelectorAll('[data-direction]').forEach(b=>b.onclick=()=>select(Number(b.dataset.direction)));updateBoard()}
function updateBoard(){const correctCells=new Set(state.puzzle.words.filter(isCorrect).flatMap(cellsOf));const w=state.puzzle.words[state.selected],active=document.getElementById('word-panel').hidden?[]:cellsOf(w);app.querySelectorAll('.cell').forEach(b=>{const k=b.dataset.key;b.querySelector('span').textContent=state.letters[k]||'';b.classList.toggle('active',active.includes(k));b.classList.toggle('cursor',k===active[0]);b.classList.remove('wrong');b.classList.toggle('correct',correctCells.has(k));b.setAttribute('aria-label',`Riga ${Number(k.split(',')[0])+1}, colonna ${Number(k.split(',')[1])+1}: ${state.letters[k]||'vuota'}`)});const n=state.puzzle.words.filter(isCorrect).length;document.getElementById('progress-bar').style.width=n/state.puzzle.words.length*100+'%';document.getElementById('progress-label').textContent=`${n} di ${state.puzzle.words.length} parole corrette`}
// Verifica automatica: chiamata soltanto quando tutte le caselle sono piene.
function check(){
 const w=state.puzzle.words[state.selected];
 if(!cellsOf(w).every(k=>Boolean(state.letters[k])))return;
 if(isCorrect(w)){
  document.getElementById('feedback').textContent='✓ Parola corretta!';
 }else{
  cellsOf(w).forEach((k,i)=>{
   if(state.letters[k]!==w.text[i])app.querySelector(`.cell[data-key="${k}"]`).classList.add('wrong');
  });
  document.getElementById('feedback').textContent='Controlla le lettere segnate in rosso e riprova.';
 }
}
function complete(){leaveGame();const m=state.module;state.completed.add(m.id);app.innerHTML=`<section class="completion"><div class="seal" aria-hidden="true">✓</div><span class="eyebrow">${esc(m.title)}</span><h1>Livello completato</h1><p>Hai trovato tutte le ${m.words.length} parole del modulo.<br>Ogni incrocio è una conoscenza in più.</p>${m.reviewMap?`<div class="map-placeholder"><h2>Mappa di ripasso</h2><img src="${esc(m.reviewMap)}" alt="Mappa di ripasso: ${esc(m.title)}"></div>`:`<div class="map-placeholder"><strong>Mappa di ripasso</strong><p>Questo spazio accoglierà la mappa dell’argomento nei prossimi aggiornamenti.</p></div>`}<div class="actions"><button class="primary" id="finish">Torna ai livelli →</button><button class="quiet" id="replay">Rigioca il modulo</button></div></section>`;document.getElementById('finish').onclick=levels;document.getElementById('replay').onclick=()=>{state.sessions.delete(m.id);startModule(MODULI.indexOf(m))};window.scrollTo(0,0)}
home();
</script></body></html>
